<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои задания</title>
    <style>
       :root {
            --gray: #929AA2;
            --beige: #B9B0B2;
            --green: #3A5154;
            --orange: #B7673C;
            --white: white;
            --radius: 5px;
        }
         body {
            background-color: var(--gray);
            color: var(--beige);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;

        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--green);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        th, td {
            border: 1px solid var(--beige);
            padding: 12px 15px;
            text-align: left;
            box-sizing: border-box;
        }
        th {
            background-color: var(--green);
        }
        td {
          color: var(--green);
        }

        a {
             color: var(--orange);
             text-decoration: none;
          }
        a:hover {
              color: #915131;
        }
        .link-container {
          display: flex;
            justify-content: center;
            margin-top: 20px;
        }
         .link-container a {
          background-color: var(--green);
            color: var(--beige);
            padding: 10px 20px;
            border-radius: var(--radius);
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .link-container a:hover {
             color: var(--orange);
        }
    </style>
</head>
<body>

  <h1>Мои задания</h1>
  <div>
  <table id="taskTable">
    <thead>
      <tr>
        <th>Название</th>
        <th>Оценка</th>
      </tr>
    </thead>
    <tbody id="solutions-table">
      <!-- Здесь будут динамически добавляться строки из базы данных -->
    </tbody>
  </table>
  <div class="link-container">
    <a href="/referenceStud">Справочные материалы</a>
</div>
</div>

      console.log(id);


        fetch('/api/students/'+id+'/solutions')
                .then(response => response.json())
                .then(solutions => {
                    const solutionsTable= document.getElementById('solutions-table');
                    solutionsTable.innerHTML = '';

                        const row = solutionsTable.insertRow();
                        const taskNameCell  = row.insertCell();
                        const markCell = row.insertCell();

    loadTasks();

  </script>
</body>
</html>
