<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генерация задания</title>
    <style>
        table {
            border-collapse: collapse;
            margin-top: 20px;
        }
        td {
            width: 30px;
            height: 30px;
            text-align: center;
            border: 1px solid #000;
        }
        .player {
            background-color: lightblue;
        }
        .cauldron {
            background-color: orange;
        }
        .potion {
            background-color: green;
        }
        .wall {
            background-color: gray;
        }
    </style>
</head>
<body>
    <h1>Генерация задания</h1>
    <form id="taskForm">
        <label for="rows">Количество строк:</label>
        <input type="number" id="rows" name="rows" min="5" max="15" required><br><br>
        
        <label for="cols">Количество столбцов:</label>
        <input type="number" id="cols" name="cols" min="5" max="15" required><br><br>
        
        <label for="numPotions">Количество зелий:</label>
        <input type="number" id="numPotions" name="numPotions" min="1" max="2" required><br><br>
        
        <label for="idTeacher">ID учителя:</label>
        <input type="number" id="idTeacher" name="idTeacher" required><br><br>
        
        <button type="button" id="generateButton">Сгенерировать задание</button>
    </form>

    <div id="visualization">
        <h2>Визуализация игрового поля</h2>
        <div id="taskOutput"></div>
        <table id="gameField"></table>
    </div>

    <script>
        document.getElementById('generateButton').addEventListener('click', async () => {
            const rows = document.getElementById('rows').value;
            const cols = document.getElementById('cols').value;
            const numPotions = document.getElementById('numPotions').value;
            const idTeacher = document.getElementById('idTeacher').value;

            try {
                const response = await fetch(`http://localhost:8080/api/solution/generate-random?rows=${rows}&cols=${cols}&numPotions=${numPotions}&idTeacher=${idTeacher}`);
                if (!response.ok) {
                    throw new Error(`Ошибка: ${response.statusText}`);
                }
                const task = await response.json();
                console.log(task); // Проверить данные задачи
                renderGameField(task);
            } catch (error) {
                alert(`Не удалось сгенерировать задание: ${error.message}`);
            }
        });

        function renderGameField(task) {
    const gridSize = task.gridSize;
    const rows = gridSize.x;
    const cols = gridSize.y;

    // Очистить предыдущую визуализацию
    const gameField = document.getElementById('gameField');
    gameField.innerHTML = '';

    // Создать таблицу
    for (let i = 0; i < rows; i++) {
        const row = document.createElement('tr');
        for (let j = 0; j < cols; j++) {
            const cell = document.createElement('td');
            row.appendChild(cell);
        }
        gameField.appendChild(row);
    }

    // Добавить игрока
    const player = task.player;
    if (isValidPosition(player, rows, cols)) {
        setCellClass(player.x, player.y, 'player');
    }

    // Добавить котёл
    const cauldron = task.cauldron;
    if (isValidPosition(cauldron, rows, cols)) {
        setCellClass(cauldron.x, cauldron.y, 'cauldron');
    }

    // Добавить зелья
    task.potions.forEach(potion => {
        if (isValidPosition(potion, rows, cols)) {
            setCellClass(potion.x, potion.y, 'potion');
        }
    });

    // Добавить стены
    task.walls.forEach(wall => {
        if (isValidPosition(wall, rows, cols)) {
            setCellClass(wall.x, wall.y, 'wall');
        }
    });
}

function isValidPosition(position, rows, cols) {
    const isValid = position.x >= 0 && position.x < rows && position.y >= 0 && position.y < cols;
    if (!isValid) {
        console.error(`Позиция вне игрового поля: (${position.x}, ${position.y})`);
    }
    return isValid;
}
        function setCellClass(x, y, className) {
    const table = document.getElementById('gameField');

    if (x < 0 || x >= table.rows.length || y < 0 || y >= table.rows[0].cells.length) {
        console.error(`Некорректная позиция: (${x}, ${y}). Игнорируется.`);
        return; // Если координаты некорректны, просто игнорируем
    }

    const cell = table.rows[x].cells[y];
    cell.classList.add(className);
}
    </script>
</body>
</html>
