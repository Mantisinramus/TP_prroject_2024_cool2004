<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список заданий</title>
    <style>
        :root {
            --gray: #929AA2;
            --beige: #B9B0B2;
            --green: #3A5154;
            --orange: #B7673C;
            --white: white;
            --radius: 5px;
        }
         body {
            background-color: var(--gray);
            color: var(--beige);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--green);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        th, td {
            border: 1px solid var(--beige);
            padding: 8px;
            text-align: left;
            box-sizing: border-box;
        }
        th {
            background-color: var(--green);
        }
        td {
          color: var(--green);
        }
        button {
             background-color: var(--orange);
             color: var(--green);
             border: none;
             padding: 10px;
             margin: 5px;
             cursor: pointer;
             border-radius: var(--radius);
             display: inline-block;
        }

        button:hover {
            background-color: #915131;
        }
        a {
             color: var(--orange);
             text-decoration: none;
          }
        a:hover {
              color: #915131;
        }
        input {
       padding: 10px; /* Отступы внутри */
       margin-bottom: 10px;
       border: 1px solid var(--beige); /* Цвет границы */
        border-radius: var(--radius);
         box-sizing: border-box;
        background-color: var(--white);
        color: var(--green);
        width: calc(40% - 22px); /* 100% ширина минус 22px отступы */
        display: block; /* Чтобы input растягивался на всю ширину контейнера*/
    }
    input:focus {
      outline: none;
        border-color: var(--orange);
    }
    </style>
</head>
<body>
    <h1>Список заданий</h1>
    <table id="studentTable">
      <thead>
        <tr>
          <th>Название</th>
          <th>Просмотр</th>
        </tr>
      </thead>
      <tbody id="task-table">
        <!-- Здесь будут динамически добавляться строки из базы данных -->
      </tbody>
    </table>
    <input id = "newTaskName" placeholder="Введите название новой задачи"> </input>
    <div>     

    <button type="submit" id="add-task-btn">Добавить задание</button>
   
    
    </div>
    <button class="form-button" id ="backButton">Вернуться назад</button>
<script>
 const backButton = document.getElementById("backButton");
backButton.addEventListener('click', () => {
  window.location.href = '/menuTeacher';
})

 function loadTasks() {
    
    fetch('api/teacher/taskAll').then(responce => responce.json())
    .then(tasks=>  
    {
      const taskTable = document.getElementById('task-table');
      taskTable.innerHTML = '';
      tasks.forEach(task => {
        const row = taskTable.insertRow();
       taskNameCell = row.insertCell();
       const actionCell = row.insertCell();
       taskNameCell.textContent = task.taskName;
       const viewButton = document.createElement('button');
       
       viewButton.textContent = "Просмотр";
       viewButton.addEventListener('click', () => {
        localStorage.setItem('getTaskId', task.taskId);
        window.location.href = '/editTask';
        });
        actionCell.appendChild(viewButton); 
      });

    }
)
  }
loadTasks();

const addTaskButton = document.getElementById('add-task-btn');
const newTaskNameInput = document.getElementById('newTaskName');
// Добавляем слушатель событий на кнопку
addTaskButton.addEventListener('click', () => {
  let newTaskName = newTaskNameInput.value;
  if(newTaskName.length>20|| newTaskName.length<9)
  {
alert("Название задания должно быть от 9 до 20 символов");
return;
  }
  else
  {
  addTask(newTaskName);
  }
});

async function addTask(newTaskName)
{
 
    if(!newTaskName)
     {
     alert("Введите название задания!")
    }
    else
    {
    const jsonData =
 {
  taskName : newTaskName,
  taskText : "Тут должно быть описание задания",
  potions: [
    { x: 0, y: 1}
  ],
  walls: [],
  player: { x: 0, y: 0 },
  cauldron: { x: 0, y:3 },
  gridSize: { x: 5, y: 5 }
 };
 const response = await fetch("/api/teacher/tasks", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify(jsonData),
        });
        loadTasks();
 }
}
  </script>
</body>
</html>
