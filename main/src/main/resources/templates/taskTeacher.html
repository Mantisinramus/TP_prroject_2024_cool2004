<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список заданий</title>
    <style>
        :root {
            --gray: #929AA2;
            --beige: #B9B0B2;
            --green: #3A5154;
            --orange: #B7673C;
            --white: white;
            --radius: 5px;
        }
         body {
            background-color: var(--gray);
            color: var(--beige);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--green);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        th, td {
            border: 1px solid var(--beige);
            padding: 8px;
            text-align: left;
            box-sizing: border-box;
        }
        th {
            background-color: var(--green);
        }
        td {
          color: var(--green);
        }
        button {
             background-color: var(--orange);
             color: var(--green);
             border: none;
             padding: 10px;
             margin: 5px;
             cursor: pointer;
             border-radius: var(--radius);
             display: inline-block;
        }

        button:hover {
            background-color: #915131;
        }
        a {
             color: var(--orange);
             text-decoration: none;
          }
        a:hover {
              color: #915131;
        }
    </style>
</head>
<body>
    <h1>Список заданий</h1>
    <table id="studentTable">
      <thead>
        <tr>
          <th>Название</th>
          <th>Просмотр</th>
        </tr>
      </thead>
      <tbody id="task-table">
        <!-- Здесь будут динамически добавляться строки из базы данных -->
      </tbody>
    </table>
    <div>        
    <button type="submit" id="add-task-btn">Добавить задание</button>
    </div>

<script>
 
 function loadTasks() {
    
    fetch('api/teacher/taskAll').then(responce => responce.json())
    .then(tasks=> 
    {
      const taskTable = document.getElementById('task-table');
      taskTable.innerHTML = '';
      tasks.forEach(task => {
        const row = taskTable.insertRow();
       taskNameCell = row.insertCell();
       const actionCell = row.insertCell();
       taskNameCell.textContent = task.taskName;
       const viewButton = document.createElement('button');
       
       viewButton.textContent = "Просмотр";
       viewButton.addEventListener('click', () => {
        localStorage.setItem('getTaskId', task.taskId);
        window.location.href = '/editTask';
        });
        actionCell.appendChild(viewButton); 
      });

    }
)
  }
loadTasks();

const addTaskButton = document.getElementById('add-task-btn');

// Добавляем слушатель событий на кнопку
addTaskButton.addEventListener('click', () => {
  window.location.href = '/editTask'; // Перенаправляем на editTask
});
  </script>
</body>
</html>
