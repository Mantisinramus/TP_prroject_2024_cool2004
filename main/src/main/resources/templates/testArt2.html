<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Field</title>
    <style>
        .grid {
            display: grid;
            gap: 1px;
            background-color: #ddd;
        }
        .cell {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }
        .player {
            background-color: blue;
        }
        .potion {
            background-color: green;
        }
        .cauldron {
            background-color: red;
        }
        .wall {
            background-color: black;
        }
    </style>
</head>
<body>
    <h1>Game Field</h1>
    <div id="gameContainer"></div>
    <br>
    <label for="commandInput">Enter Command:</label>
    <input type="text" id="commandInput" placeholder="Move command (e.g., 'UP')">
    <button id="sendCommand">Send Command</button>
    <div id="gameLog"></div>

    <script>
        const gameContainer = document.getElementById("gameContainer");
        const commandInput = document.getElementById("commandInput");
        const sendCommandButton = document.getElementById("sendCommand");
        const gameLog = document.getElementById("gameLog");

        const rows = 5; // Example grid size
        const cols = 5;

        // Initial Game State
        let gameState = {
            player: { x: 1, y: 1 },
            potions: [{ x: 3, y: 1 }],
            cauldron: { x: 4, y: 4 },
            walls: [{ x: 2, y: 2 }],
        };

        // Function to create the grid
        function createGrid(rows, cols) {
            gameContainer.style.gridTemplateRows = `repeat(${rows}, 40px)`;
            gameContainer.style.gridTemplateColumns = `repeat(${cols}, 40px)`;
            gameContainer.innerHTML = "";

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement("div");
                    cell.classList.add("cell");
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    gameContainer.appendChild(cell);
                }
            }
        }

        // Function to render the game state
        function renderGame(state) {
            const cells = document.querySelectorAll(".cell");
            cells.forEach(cell => {
                cell.className = "cell";
            });

            // Render player
            const playerCell = document.querySelector(`[data-row="${state.player.y}"][data-col="${state.player.x}"]`);
            if (playerCell) playerCell.classList.add("player");

            // Render potions
            state.potions.forEach(potion => {
                const potionCell = document.querySelector(`[data-row="${potion.y}"][data-col="${potion.x}"]`);
                if (potionCell) potionCell.classList.add("potion");
            });

            // Render cauldron
            const cauldronCell = document.querySelector(`[data-row="${state.cauldron.y}"][data-col="${state.cauldron.x}"]`);
            if (cauldronCell) cauldronCell.classList.add("cauldron");

            // Render walls
            state.walls.forEach(wall => {
                const wallCell = document.querySelector(`[data-row="${wall.y}"][data-col="${wall.x}"]`);
                if (wallCell) wallCell.classList.add("wall");
            });
        }

        // Send command to backend
        sendCommandButton.addEventListener("click", async () => {
            const command = commandInput.value.trim();
            if (!command) {
                alert("Please enter a command.");
                return;
            }

            try {
                const response = await fetch("/api/game/move", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ command }),
                });

                if (!response.ok) throw new Error("Failed to fetch");

                const result = await response.json();

                // Process game state changes
                updateGameLog(result);
                result.forEach(step => {
                    gameState.player = step.playerPosition;
                    gameState.potions = step.potions;
                    renderGame(gameState);
                });
            } catch (error) {
                console.error("Error:", error);
            }
        });

        // Update the game log
        function updateGameLog(log) {
            gameLog.innerHTML = "<h2>Game Log:</h2>";
            log.forEach((step, index) => {
                const logEntry = document.createElement("div");
                logEntry.textContent = `Step ${index + 1}: Player at (${step.playerPosition.x}, ${step.playerPosition.y}), Potions: ${JSON.stringify(step.potions)}, Answer: ${step.answer}`;
                gameLog.appendChild(logEntry);
            });
        }

        // Initial setup
        createGrid(rows, cols);
        renderGame(gameState);
    </script>
</body>
</html>
