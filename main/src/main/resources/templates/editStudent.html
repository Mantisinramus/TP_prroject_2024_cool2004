<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование ученика</title>
    <style>
        :root {
            --gray: #929AA2;
            --beige: #B9B0B2;
            --green: #3A5154;
            --orange: #B7673C;
            --white: white;
            --radius: 5px;
        }

        body {
            background-color: var(--gray);
            color: var(--beige);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--green);
        }

        .edit-student-form {
            background-color: var(--green);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
             align-items: center;
        }

       input {
           background-color: var(--beige);
           color: var(--green);
           border: 1px solid var(--green);
           border-radius: var(--radius);
           padding: 10px;
           margin-bottom: 10px;
           width: calc(50% - 22px);
           box-sizing: border-box;
           font-size: 16px;
           display: inline-block;
        }


       button {
             background-color: var(--orange);
             color: var(--green);
             border: none;
             padding: 10px;
             margin: 5px;
             cursor: pointer;
             border-radius: var(--radius);
             display: inline-block;
        }


        button:hover {
           background-color: #915131;
        }

        .form-button {
          background-color: var(--orange);
            color: var(--green);
             border: none;
             padding: 10px;
             margin: 5px;
             cursor: pointer;
             border-radius: var(--radius);
        }
        .form-button:hover {
             background-color: #915131;
        }
    </style>
</head>
<body>
    <h1>Редактирование данных ученика</h1>
    <div class="edit-student-form">
        <input type="text" placeholder="Введите ФИО ученика" id="studentName">
        <input type="text" placeholder="Введите логин ученика" id="studentLogin">
        <input type="text" placeholder="Введите пароль ученика" id="studentPassword">
        <button class="form-button" id="saveButton">Сохранить</button>
    </div>

<script>
    const saveButton = document.getElementById('saveButton');
    const studentId = localStorage.getItem('editStudentId');

    async function loadStudent() {
          fetch(`/api/teacher/students/${studentId}`)
                .then(response => response.json())
                .then(student => {
                    document.getElementById('studentName').value = student.studentInitials;
                    document.getElementById('studentLogin').value = student.studentLogin;
                    document.getElementById('studentPassword').value = student.studentPassword;

                })
    }

    loadStudent();

    saveButton.addEventListener('click', async () => {
      const studentName = document.getElementById('studentName').value;
      const studentLogin = document.getElementById('studentLogin').value;
      const studentPassword = document.getElementById('studentPassword').value;
      let alertStr = "";
      if(studentName.length<10||studentName.length>80)
    {
      alertStr+= "Длина ФИО ученика должна быть от 10 до 80 символов";
    }
    if(studentLogin.length<4||studentLogin.length>8)
    {
      alertStr+= "\nДлина логина ученика должна быть от 4 до 8 символов";
    }
    if(studentPassword.length<4||studentPassword.length>12)
    {
      alertStr+= "\nДлина пароля ученика должна быть от 4 до 8 символов";
    }

    if (alertStr.length!= 0) 
    {
      alert(alertStr);  
      return;
    }
    else
    {
      try {
            const response2 = await fetch(`/api/teacher/students/${studentId}/login?login=${studentLogin}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                },
            });
            if (!response2.ok) {
               alert("Указанный логин не уникален");
               return;
            }
            
            const response1 = await fetch(`/api/teacher/students/${studentId}/password?password=${studentPassword}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                },
            });
            const response3 = await fetch(`/api/teacher/students/${studentId}/initials?initials=${studentName}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                },
            });
            

           
            window.location.href = '/adminTeacher';
            const responseText = await response.text();
            console.log('Ответ успешно отправлен:', responseText);
           
        } catch (error) {
            console.error('Ошибка при отправке данных:', error);
        }
    }
});

</script>
</body>
</html>
