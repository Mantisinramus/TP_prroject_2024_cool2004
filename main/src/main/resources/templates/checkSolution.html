<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка решения</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .description {
            background-color: var(--green);
            color: var(--beige);
            border-radius: var(--radius);
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .flex-container {
            display: flex;
            box-sizing: border-box;
        }

        .game-field {
            background-color: var(--orange);
            width: 60%;
            border-radius: var(--radius);
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .game-field table {
            border-collapse: collapse;
            margin: 0;
            box-sizing: border-box;
            width: auto;
        }

        .game-field table td {
            padding: 0;
            border: 1px solid var(--white);
        }
        .game-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--green);
            color: var(--beige);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 40%;
            box-sizing: border-box;
        }
        h2 {
            color: var(--beige);
        }
        .solution {
            background-color: var(--green);
            padding: 15px;
            border-radius: var(--radius);
            width: 90%;
            box-sizing: border-box;
        }
        .solution-area {
           border: 2px dashed var(--beige);
           min-height: 200px;
           width: 90%;
           padding: 10px;
           display: flex;
           flex-direction: column;
           align-items: flex-start;
           margin-right: 20px;
           position: relative;
            box-sizing: border-box;
       }
        #solutionDisplay .loop-container {
            border: 2px dashed var(--beige);;
            padding: 5px;
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            width: fit-content;
            min-width: 100px;
            position: relative;
            background-color: var(--green);
            border-radius: var(--radius);
            align-items: center;
        }
        .feedback {
            background-color: var(--green);
            color: var(--beige);
            padding: 15px;
            border-radius: var(--radius);
            margin-top: 20px;
            box-sizing: border-box;
            width: 100%;
        }
        .primitive-img {
          width: 40px;
          height: 40px;
          margin: 5px;
            box-sizing: border-box;
        }
        .draggable-items {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    .draggable-items img {
      cursor: grab;
      margin: 0 10px;
      width: 60px;
      height: auto;
    } .drop-area {
      border: 2px dashed #ccc;
      min-height: 200px;
      width: 300px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-right: 20px;
      position: relative;
    }
    
    .drop-area img {
      width: 60px;
      height: auto;
      position: relative;
      margin-bottom: 5px;
    }
    
    .drop-area .loop-container {
      border: 2px dashed lightblue;
      padding: 5px;
      margin-bottom: 5px;
      display: flex;
      flex-direction: column;
      width: fit-content;
      min-width: 100px;
      position: relative;
      background-color: #3A5154;
      border-radius: 5px;
      align-items: center;
    }
    
    .drop-area .loop-container img {
      margin-left: 20px;
      margin-bottom: 5px;
    }
    
    .drop-area .loop-container input {
      margin-bottom: 5px;
      width: 40px;
      height: 20px;
      border: 1px solid #333;
      border-radius: 3px;
      text-align: center;
      background-color: white;
      font-size: 14px;
      padding: 0;
    }
    
    .drop-area .loop-container .iterations-label {
      display: none;
    }
    </style>
</head>






<body>
<h1 id="taskName"></h1>

<div class="description">
    <p id="task-description"></p>
</div>

<div class="flex-container">
    <div class="game-field" id="gameField">
        <!-- Таблица будет динамически добавлена здесь -->
    </div>
    <div class="container">
        <h2>Решение</h2>
        <div style="display:flex;" class="solution">
            <div class="drop-area" id="solutionDisplay">
 
            </div>
        </div> 
        <div style="display:flex;">
            <button class="btn-custom" style="font-weight: 700;" onclick="checkStudentSolution()">Проверить решение</button>
        </div>
        <h2 id = "stepResult">Здесь будет отображатся каждый шаг решения</h2>
    </div>
</div>

<div class="feedback">
    <h5>Оставить комментарий: </h5>
    <textarea id="teacherResponse"></textarea>
    <h5>Оценка:</h5>
    <select style="margin-bottom: 10px;" id="userScore">
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
        <option value="2">2</option>
        <option value="0">0</option>
    </select>
    <div style="display:flex;">
        <button class="btn-custom" style="font-weight: 700;" onclick="sendFeedback()">Оценить решение</button>
    </div>
</div>

<button class="form-button" id ="backButton">Вернуться назад</button>
<script>
   const backButton = document.getElementById("backButton");
backButton.addEventListener('click', () => {
  window.location.href = '/journalTeacher';
})
function createTable(y_s, x_s, cellSize) {
  let table = '<table id="tablet">';
  for (let i = 0; i < y_s; i++) {
    table += '<tr>';
    for (let j = 0; j < x_s; j++) {
      table += `<td id="cell_${j}_${i}" style="width: ${cellSize}px; height: ${cellSize}px;"></td>`;
    }
    table += '</tr>';
  }
  table += '</table>';
  return table;
}

const taskId = localStorage.getItem("taskToCheck");
const studentToCheck = localStorage.getItem("studentToCheck");

async function load() {
  let imgPlayer = document.createElement('img');
  imgPlayer.src = 'hero.png';
  imgPlayer.classList.add('game-element', 'player-img');

  let imgCauldron = document.createElement('img');
  imgCauldron.src = 'kotyol.png';
  imgCauldron.classList.add('game-element', 'cauldron-img');

  try {
    const taskResponse = await fetch('api/teacher/tasks/' + taskId);
    const taskData = await taskResponse.json();

    document.getElementById("taskName").textContent = taskData.taskName;
    document.getElementById("task-description").textContent = taskData.taskText;

    const y_s = taskData.gridSize.y;
    const x_s = taskData.gridSize.x;
    const cellSize = 40;

    document.getElementById('gameField').innerHTML = createTable(y_s, x_s, cellSize);

    let playerCell = document.getElementById('cell_' + taskData.player.x + '_' + taskData.player.y);
    playerCell.appendChild(imgPlayer);

    let cauldronCell = document.getElementById('cell_' + taskData.cauldron.x + '_' + taskData.cauldron.y);
    cauldronCell.appendChild(imgCauldron);

    taskData.walls.forEach(wall => {
      let wallCell = document.getElementById('cell_' + wall.x + '_' + wall.y);
      let imgWall = document.createElement('img');
      imgWall.src = 'wall.png';
      imgWall.classList.add('game-element', 'wall-img');
      wallCell.appendChild(imgWall);
    });

    taskData.potions.forEach(potion => {
      let potionCell = document.getElementById('cell_' + potion.x + '_' + potion.y);
      let imgPotion = document.createElement('img');
      imgPotion.src = 'posion1.png';
      imgPotion.classList.add('game-element', 'potion-img');
      potionCell.appendChild(imgPotion);
    });

    const solutionResponse = await fetch(`/api/teacher/students/${studentToCheck}/solution/${taskId}`);
    const solutionData = await solutionResponse.json();

    document.getElementById("teacherResponse").value = solutionData.teacherAnswer;
    document.getElementById("userScore").value = solutionData.mark;

    const sequenceText = solutionData.sequenceText;
    console.log(sequenceText);
    const seq = sequenceText.split(/\s*,\s*/).filter(item => item !== "");
    loadSequence(seq);

  } catch (error) {
    console.error('Ошибка загрузки данных:', error);
  }
}
const dropArea = document.getElementById("solutionDisplay");

function addElementToDropArea(elementToAdd, placeToAdd) {
      const imgElement = document.createElement('img');
      imgElement.src = elementToAdd + ".png"; 
      imgElement.alt = elementToAdd.charAt(0) + elementToAdd.slice(1);
      imgElement.className = 'draggable';
      imgElement.setAttribute('data-item', elementToAdd);
      placeToAdd.appendChild(imgElement);
    }

    function addLoopToDropArea(iterations, placeToAdd, depth) {
      const loopContainer = document.createElement('div');
      loopContainer.classList.add('loop-container');
      loopContainer.setAttribute('data-depth', depth);
      loopContainer.setAttribute('draggable', 'true');
      const input = document.createElement('input');
      input.type = 'number';
      input.min = 1;
      input.max = 10;
      input.value = iterations;
      loopContainer.appendChild(input);
      placeToAdd.appendChild(loopContainer);
      return loopContainer;
    }

    function loadSequence(finStr) {
      let depth = 0;
      dropArea.innerHTML = '';
      finStr.forEach(ss => {
        console.log(ss);
        if (ss.startsWith('repeat ')) {
          let loopContainer = addLoopToDropArea(ss[7], dropArea, depth);
          ss = workRepeat(ss);
          ss = splitString(ss);
          finForLoop(ss, loopContainer, depth + 1);
        } else {
          addElementToDropArea(ss, dropArea);
        }
      });
    }

    function finForLoop(loopString, loopContainer, depth) {
      loopString.forEach(ss => {
        console.log(ss);
        if (ss.startsWith('repeat ')) {
          let downLoopContainer = addLoopToDropArea(ss[7], loopContainer, depth);
          ss = workRepeat(ss);
          ss = splitString(ss);
          finForLoop(ss, downLoopContainer, depth + 1);
        } else {
          addElementToDropArea(ss, loopContainer);
        }
      });
    }

    function workRepeat(subStr) {
      let seq1 = subStr.slice(9);
      seq1 = seq1.slice(0, -1);
      return seq1;
    }

    function splitString(inputString) {
      const result = [];
      let currentString = "";
      let level = 0;
      let ignoreLevel = 0;
      for (let i = 0; i < inputString.length; i++) {
        const char = inputString[i];
        if (char === '(') {
          level++;
        } else if (char === ')') {
          level--;
        }
        if (char === ';' && level === 0 && ignoreLevel === 0) {
          result.push(currentString.trim());
          currentString = "";
        } else if (char === '(') {
          currentString += char;
          ignoreLevel++;
        } else if (char === ')') {
          currentString += char;
          ignoreLevel--;
        } else {
          currentString += char;
        }
      }
      if (currentString.trim() !== "") {
        result.push(currentString.trim());
      }
      return result;
    }


    async function checkStudentSolution() 
    {
      try {
                let response = await fetch(`http://localhost:8080/api/solution/checkSequence/${studentToCheck}/${taskId}`);
                if (!response.ok) throw new Error("Failed to check sequence");
                let sequence = await response.json();
                const table = document.getElementById('tablet');
                const cells = table.querySelectorAll('td');
              cells.forEach(cell => 
              {
                if(cell.children[0]!=undefined)
                {
                  if(cell.children[0].src=="http://localhost:8080/hero.png" ||cell.children[0].src=="http://localhost:8080/posion1.png"  )
                  {
                   cell.textContent = '';
                  }
                }
              
              });
              
              console.log(sequence);
              let imgPlayer = document.createElement('img');
              imgPlayer.src = 'hero.png'; // Замените на путь к вашему изображению
              imgPlayer.style.width = '100%'; //  или другой нужный размер
              imgPlayer.style.height = '100%';
              imgPlayer.style.objectFit = 'cover';
             


              let stepResult = document.getElementById("stepResult");
              
              let stepResultStartValue  = stepResult.textContent;
              for (const step of sequence) 
                {
                  cells.forEach(cell => 
              {
                if(cell.children[0]!=undefined)
                {
                  if(cell.children[0].src=="http://localhost:8080/posion1.png"  )
                  {
                    
                   cell.textContent = '';
                  }
                }
              
              });
             

                  console.log(stepResultStartValue);
                  let playerCell = document.getElementById('cell_' + step.playerPosition.x + '_' + step.playerPosition.y);
                  playerCell.appendChild(imgPlayer);
                  
                

                  step.potions.forEach(potion => {
                    
                  let potionCell = document.getElementById('cell_' + potion.x + '_' + potion.y);
                 
              let imgPotion = document.createElement('img');
                  imgPotion.src = 'posion1.png'; // Замените на путь к вашему изображению
                  imgPotion.style.width = '100%'; //  или другой нужный размер
                  imgPotion.style.height = '100%';
                  imgPotion.style.objectFit = 'cover';
                  console.log(potionCell);
                  potionCell.appendChild(imgPotion);

                });
                stepResult.textContent = step.answer;
                await delay(1000);
                
                }
                await delay(2000);
                stepResult.textContent = stepResultStartValue;
                load();

    }
    catch (error) {
                console.error("Error checking sequence:", error);
            }
  }

function delay(ms) {
  return new Promise(resolve => {
    setTimeout(resolve, ms);
  });
}

// Остальные функции (addElementToDisplay, addLoopToDisplay, loadSolutionDisplay и т.д.) остаются без изменений.

async function sendFeedback() {
  const teacherResponse = document.getElementById('teacherResponse').value;
  const userScore = document.getElementById('userScore').value;

  try {
    await fetch(`/api/teacher/students/${studentToCheck}/tasks/${taskId}/answer?answer=${encodeURIComponent(teacherResponse)}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
    });

    await fetch(`/api/teacher/students/${studentToCheck}/tasks/${taskId}/mark?mark=${encodeURIComponent(userScore)}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
      },
    });

    load();
  } catch (error) {
    console.error('Ошибка при отправке данных:', error);
    alert('Ошибка при отправке данных ученику');
  }
}

load();

</script>
</body>
</html>
