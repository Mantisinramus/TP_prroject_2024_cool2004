<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка решения</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .description {
            background-color: var(--green);
            color: var(--beige);
            border-radius: var(--radius);
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .flex-container {
            display: flex;
            box-sizing: border-box;
        }

        .game-field {
            background-color: var(--orange);
            width: 60%;
            border-radius: var(--radius);
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .game-field table {
            border-collapse: collapse;
            margin: 0;
            box-sizing: border-box;
            width: auto;
        }

        .game-field table td {
            padding: 0;
            border: 1px solid var(--white);
        }
        .game-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--green);
            color: var(--beige);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 40%;
            box-sizing: border-box;
        }
        h2 {
            color: var(--beige);
        }
        .solution {
            background-color: var(--green);
            padding: 15px;
            border-radius: var(--radius);
            width: 90%;
            box-sizing: border-box;
        }
        .solution-area {
           border: 2px dashed var(--beige);
           min-height: 200px;
           width: 90%;
           padding: 10px;
           display: flex;
           flex-direction: column;
           align-items: flex-start;
           margin-right: 20px;
           position: relative;
            box-sizing: border-box;
       }
        #solutionDisplay .loop-container {
            border: 2px dashed var(--beige);;
            padding: 5px;
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            width: fit-content;
            min-width: 100px;
            position: relative;
            background-color: var(--green);
            border-radius: var(--radius);
            align-items: center;
        }
        .feedback {
            background-color: var(--green);
            color: var(--beige);
            padding: 15px;
            border-radius: var(--radius);
            margin-top: 20px;
            box-sizing: border-box;
            width: 100%;
        }
        .primitive-img {
          width: 40px;
          height: 40px;
          margin: 5px;
            box-sizing: border-box;
        }
    </style>
</head>






<body>
<h1 id="taskName"></h1>

<div class="description">
    <p id="task-description"></p>
</div>

<div class="flex-container">
    <div class="game-field" id="gameField">
        <!-- Таблица будет динамически добавлена здесь -->
    </div>
    <div class="container">
        <h2>Решение</h2>
        <div style="display:flex;" class="solution">
            <div class="solution-area" id="solutionDisplay">
 
            </div>
        </div> 
        <div style="display:flex;">
            <button class="btn-custom" style="font-weight: 700;" onclick="getDraggedItems()">Проверить решение</button>
        </div>
    </div>
</div>

<div class="feedback">
    <h5>Оставить комментарий: </h5>
    <textarea id="teacherResponse"></textarea>
    <h5>Оценка:</h5>
    <select style="margin-bottom: 10px;" id="userScore">
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
        <option value="2">2</option>
        <option value="0">0</option>
    </select>
    <div style="display:flex;">
        <button class="btn-custom" style="font-weight: 700;" onclick="sendFeedback()">Оценить решение</button>
    </div>
</div>









<script>
    function createTable(y_s, x_s, cellSize) {
      let table = '<table>';
      for (let i = 0; i < y_s; i++) {
          table += '<tr>';
          for (let j = 0; j < x_s; j++) {
              table += `<td id="cell_${j}_${i}" style="width: ${cellSize}px; height: ${cellSize}px;"></td>`;
          }
          table += '</tr>';
      }
      table += '</table>';
      return table;
  }
  const taskId = localStorage.getItem("taskId");
  const solutionId = localStorage.getItem("solutionId");

    function load() {
        let imgPlayer = document.createElement('img');
        imgPlayer.src = 'hero.png';
        imgPlayer.classList.add('game-element', 'player-img');

        let imgCauldron = document.createElement('img');
        imgCauldron.src = 'kotyol.png';
        imgCauldron.classList.add('game-element', 'cauldron-img');


    fetch('api/teacher/tasks/' + taskId)
      .then(response => response.json())
      .then(data => {
        let taskNameElement = document.getElementById("taskName");
        taskNameElement.textContent = data.taskName;
        let taskDescElement = document.getElementById("task-description");
        taskDescElement.textContent = data.taskText;
        const y_s = data.gridSize.y;
        const x_s = data.gridSize.x;
        const cellSize = 40;
        document.getElementById('gameField').innerHTML = createTable(y_s, x_s, cellSize);
        let playerCell = document.getElementById('cell_' + data.player.x + '_' + data.player.y);
        playerCell.appendChild(imgPlayer);
        let cauldronCell = document.getElementById('cell_' + data.cauldron.x + '_' + data.cauldron.y);
        cauldronCell.appendChild(imgCauldron);
        data.walls.forEach(wall => {
            let wallCell = document.getElementById('cell_' + wall.x + '_' + wall.y);
            let imgWall = document.createElement('img');
            imgWall.src = 'wall.png';
            imgWall.classList.add('game-element', 'wall-img');
            wallCell.appendChild(imgWall);
        });
          data.potions.forEach(potion => {
            let potionCell = document.getElementById('cell_' + potion.x + '_' + potion.y);
            let imgPotion = document.createElement('img');
            imgPotion.src = 'posion1.png';
            imgPotion.classList.add('game-element', 'potion-img');
            potionCell.appendChild(imgPotion);
        });
      })
       .catch(error => {
          console.error('Ошибка загрузки данных о задаче:', error);
          // Можно добавить отображение сообщения об ошибке пользователю
      });

    fetch('api/students/solutions/' + solutionId)
       .then(response => response.json())
       .then(data => {
         console.log(solutionId);
         console.log(data);
          let feedbackArea = document.getElementById("teacherResponse");
          feedbackArea.value = data.teacherAnswer;
          let markArea = document.getElementById("userScore");
         markArea.value = data.mark;
          let str = data.sequenceText;
         let seq = str.split(/\s*,\s*/).filter(item => item !== "");
         loadSolutionDisplay(seq);
        })
        .catch(error => {
          console.error('Ошибка загрузки данных о решении:', error);
          // Можно добавить отображение сообщения об ошибке пользователю
      });
    }
    function addElementToDisplay(elementToAdd, placeToAdd) {
    const imgElement = document.createElement('img');
    imgElement.src = "" + elementToAdd + ".png"; // Путь к картинкам относительно текущей директории
    imgElement.alt = elementToAdd.charAt(0).toUpperCase() + elementToAdd.slice(1);
    imgElement.className = 'primitive-img';
    placeToAdd.appendChild(imgElement);
}

function addLoopToDisplay(iterations, placeToAdd, depth) {
    const loopContainer = document.createElement('div');
    loopContainer.classList.add('loop-container');
    loopContainer.setAttribute('data-depth', depth);
    const label = document.createElement('label');
    label.textContent = 'repeat (' + iterations + ')';
    loopContainer.appendChild(label);
    placeToAdd.appendChild(loopContainer);
    return loopContainer;
}


function loadSolutionDisplay(finStr) {
    let depth = 0;
    const solutionDisplay = document.getElementById('solutionDisplay');
    finStr.forEach(ss => {
        if (ss.startsWith('repeat ')) {
            let loopContainer = addLoopToDisplay(ss[7], solutionDisplay, depth);
            ss = workRepeat(ss);
            ss = splitString(ss);
            finForDisplay(ss, loopContainer, depth + 1);
        } else {
            addElementToDisplay(ss, solutionDisplay);
        }
    });
}

function finForDisplay(loopString, loopContainer, depth) {
    loopString.forEach(ss => {
        if (ss.startsWith('repeat ')) {
            let downLoopContainer = addLoopToDisplay(ss[7], loopContainer, depth);
            ss = workRepeat(ss);
            ss = splitString(ss);
            finForDisplay(ss, downLoopContainer, depth +1);
        } else {
            addElementToDisplay(ss, loopContainer);
        }
    });
}


function workRepeat(subStr) {
  let seq1 = subStr.slice(9);
  seq1 = seq1.slice(0, -1);
  return seq1;
}

function splitString(inputString) {
  const result = [];
  let currentString = "";
  let level = 0;
  let ignoreLevel = 0;
  for (let i = 0; i < inputString.length; i++) {
    const char = inputString[i];
    if (char === '(') {
      level++;
    } else if (char === ')') {
      level--;
    }
    if (char === ';' && level === 0 && ignoreLevel === 0) {
      result.push(currentString.trim());
      currentString = "";
    } else if (char === '(') {
      currentString += char;
      ignoreLevel++;
    } else if (char === ')') {
      currentString += char;
      ignoreLevel--;
    } else {
      currentString += char;
    }
  }
  if (currentString.trim() !== "") {
    result.push(currentString.trim());
  }
  return result;
}

    const teacherResponse = document.getElementById('teacherResponse').value;
    const userScore = document.getElementById('userScore').value;

            method: 'POST',

            },
        });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
        }
        const responseText = await response.text();
        console.log('Ответ успешно отправлен:', responseText);
        alert('Отзыв отправлен')
            // Здесь можно добавить обработку успешного ответа, например, вывод сообщения пользователю
        } catch (error) {
            console.error('Ошибка при отправке ответа:', error);
        alert('Ошибка при отправке отзыва')
        // Здесь можно добавить обработку ошибки, например, вывод сообщения об ошибке пользователю
        }
    }
    load();
</script>
</body>
</html>
