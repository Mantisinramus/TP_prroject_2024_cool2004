<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка решения</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .description {
            background-color: var(--green);
            color: var(--beige);
            border-radius: var(--radius);
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .flex-container {
            display: flex;
            box-sizing: border-box;
        }

        .game-field {
            background-color: var(--orange);
            width: 60%;
            border-radius: var(--radius);
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .game-field table {
            border-collapse: collapse;
            margin: 0;
            box-sizing: border-box;
            width: auto;
        }

        .game-field table td {
            padding: 0;
            border: 1px solid var(--white);
        }
        .game-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--green);
            color: var(--beige);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 40%;
            box-sizing: border-box;
        }
        h2 {
            color: var(--beige);
        }
        .solution {
            background-color: var(--green);
            padding: 15px;
            border-radius: var(--radius);
            width: 90%;
            box-sizing: border-box;
        }
        .solution-area {
           border: 2px dashed var(--beige);
           min-height: 200px;
           width: 90%;
           padding: 10px;
           display: flex;
           flex-direction: column;
           align-items: flex-start;
           margin-right: 20px;
           position: relative;
            box-sizing: border-box;
       }
        #solutionDisplay .loop-container {
            border: 2px dashed var(--beige);;
            padding: 5px;
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            width: fit-content;
            min-width: 100px;
            position: relative;
            background-color: var(--green);
            border-radius: var(--radius);
            align-items: center;
        }
        .feedback {
            background-color: var(--green);
            color: var(--beige);
            padding: 15px;
            border-radius: var(--radius);
            margin-top: 20px;
            box-sizing: border-box;
            width: 100%;
        }
        .primitive-img {
          width: 40px;
          height: 40px;
          margin: 5px;
            box-sizing: border-box;
        }
    </style>
</head>






<body>
<h1 id="taskName"></h1>

<div class="description">
    <p id="task-description"></p>
</div>

<div class="flex-container">
    <div class="game-field" id="gameField">
        <!-- Таблица будет динамически добавлена здесь -->
    </div>
    <div class="container">
        <h2>Решение</h2>
        <div style="display:flex;" class="solution">
            <div class="solution-area" id="solutionDisplay">
 
            </div>
        </div> 
        <div style="display:flex;">
            <button class="btn-custom" style="font-weight: 700;" onclick="getDraggedItems()">Проверить решение</button>
        </div>
    </div>
</div>

<div class="feedback">
    <h5>Оставить комментарий: </h5>
    <textarea id="teacherResponse"></textarea>
    <h5>Оценка:</h5>
    <select style="margin-bottom: 10px;" id="userScore">
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
        <option value="2">2</option>
        <option value="0">0</option>
    </select>
    <div style="display:flex;">
        <button class="btn-custom" style="font-weight: 700;" onclick="sendFeedback()">Оценить решение</button>
    </div>
</div>









<script>
function createTable(y_s, x_s, cellSize) {
  let table = '<table id="tablet">';
  for (let i = 0; i < y_s; i++) {
    table += '<tr>';
    for (let j = 0; j < x_s; j++) {
      table += `<td id="cell_${j}_${i}" style="width: ${cellSize}px; height: ${cellSize}px;"></td>`;
    }
    table += '</tr>';
  }
  table += '</table>';
  return table;
}

const taskId = localStorage.getItem("taskToCheck");
const studentToCheck = localStorage.getItem("studentToCheck");

async function load() {
  let imgPlayer = document.createElement('img');
  imgPlayer.src = 'hero.png';
  imgPlayer.classList.add('game-element', 'player-img');

  let imgCauldron = document.createElement('img');
  imgCauldron.src = 'kotyol.png';
  imgCauldron.classList.add('game-element', 'cauldron-img');

  try {
    const taskResponse = await fetch('api/teacher/tasks/' + taskId);
    const taskData = await taskResponse.json();

    document.getElementById("taskName").textContent = taskData.taskName;
    document.getElementById("task-description").textContent = taskData.taskText;

    const y_s = taskData.gridSize.y;
    const x_s = taskData.gridSize.x;
    const cellSize = 40;

    document.getElementById('gameField').innerHTML = createTable(y_s, x_s, cellSize);

    let playerCell = document.getElementById('cell_' + taskData.player.x + '_' + taskData.player.y);
    playerCell.appendChild(imgPlayer);

    let cauldronCell = document.getElementById('cell_' + taskData.cauldron.x + '_' + taskData.cauldron.y);
    cauldronCell.appendChild(imgCauldron);

    taskData.walls.forEach(wall => {
      let wallCell = document.getElementById('cell_' + wall.x + '_' + wall.y);
      let imgWall = document.createElement('img');
      imgWall.src = 'wall.png';
      imgWall.classList.add('game-element', 'wall-img');
      wallCell.appendChild(imgWall);
    });

    taskData.potions.forEach(potion => {
      let potionCell = document.getElementById('cell_' + potion.x + '_' + potion.y);
      let imgPotion = document.createElement('img');
      imgPotion.src = 'posion1.png';
      imgPotion.classList.add('game-element', 'potion-img');
      potionCell.appendChild(imgPotion);
    });

    const solutionResponse = await fetch(`/api/teacher/students/${studentToCheck}/solution/${taskId}`);
    const solutionData = await solutionResponse.json();

    document.getElementById("teacherResponse").value = solutionData.teacherAnswer;
    document.getElementById("userScore").value = solutionData.mark;

    const sequenceText = solutionData.sequenceText;
    const seq = sequenceText.split(/\s*,\s*/).filter(item => item !== "");
    loadSolutionDisplay(seq);

  } catch (error) {
    console.error('Ошибка загрузки данных:', error);
  }
}






async function getDraggedItems() {
    try {
    const response = await fetch(`http://localhost:8080/api/solution/checkSequence/${studentToCheck}/${taskId}`);
    if (!response.ok) throw new Error("Failed to check sequence");

    const sequence = await response.json();
    const table = document.getElementById('tablet');
    const cells = table.querySelectorAll('td');

    let currentPlayerCell = null;

    for (const step of sequence) {
      // Удалить героя с предыдущей позиции
      if (currentPlayerCell) {
        currentPlayerCell.textContent = '';
      }

      // Найти новую ячейку для героя
      currentPlayerCell = document.getElementById('cell_' + step.playerPosition.x + '_' + step.playerPosition.y);

      // Добавить изображение героя в новую ячейку
      let imgPlayer = document.createElement('img');
      imgPlayer.src = 'hero.png';
      imgPlayer.style.width = '100%';
      imgPlayer.style.height = '100%';
      imgPlayer.style.objectFit = 'cover';
      currentPlayerCell.appendChild(imgPlayer);

      // Обновить зелья
      cells.forEach(cell => {
        if (cell.children[0] && cell.children[0].src.includes("posion1.png")) {
          cell.textContent = '';
        }
      });

      step.potions.forEach(potion => {
        let potionCell = document.getElementById('cell_' + potion.x + '_' + potion.y);
        let imgPotion = document.createElement('img');
        imgPotion.src = 'posion1.png';
        imgPotion.style.width = '100%';
        imgPotion.style.height = '100%';
        imgPotion.style.objectFit = 'cover';
        potionCell.appendChild(imgPotion);
      });

      // Задержка для визуализации
      await delay(2000);
    }
  } catch (error) {
    console.error("Error checking sequence:", error);
  }
}

function delay(ms) {
  return new Promise(resolve => {
    setTimeout(resolve, ms);
  });
}

// Остальные функции (addElementToDisplay, addLoopToDisplay, loadSolutionDisplay и т.д.) остаются без изменений.

async function sendFeedback() {
  const teacherResponse = document.getElementById('teacherResponse').value;
  const userScore = document.getElementById('userScore').value;

  try {
    await fetch(`/api/teacher/students/${studentToCheck}/tasks/${taskId}/answer?answer=${encodeURIComponent(teacherResponse)}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
    });

    await fetch(`/api/teacher/students/${studentToCheck}/tasks/${taskId}/mark?mark=${encodeURIComponent(userScore)}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
      },
    });

    load();
  } catch (error) {
    console.error('Ошибка при отправке данных:', error);
    alert('Ошибка при отправке данных ученику');
  }
}

load();

</script>
</body>
</html>
